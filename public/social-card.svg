<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0f1a14" />
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="url(#felt)" stroke="#d9b45a" stroke-width="4" />
  <rect x="48" y="48" width="1104" height="534" rx="12" stroke="#d9b45a" stroke-opacity="0.35" stroke-dasharray="2 8" />

  <g transform="translate(110 150)">
    <polygon points="120,10 230,210 10,210" fill="url(#red)" stroke="#f4d9d9" stroke-opacity="0.5" stroke-width="2" />
    <polygon points="120,10 120,210 10,210" fill="#000" fill-opacity="0.14" />
    <text x="120" y="182" fill="#fff7ee" font-family="Georgia, serif" font-size="46" text-anchor="middle">Dm7</text>
  </g>
  <g transform="translate(380 130)">
    <polygon points="120,0 240,120 120,240 0,120" fill="url(#gold)" stroke="#fff3cf" stroke-opacity="0.55" stroke-width="2" />
    <polygon points="120,0 240,120 120,120" fill="#fff" fill-opacity="0.16" />
    <text x="120" y="136" fill="#2a1d06" font-family="Georgia, serif" font-size="50" text-anchor="middle">G7</text>
  </g>
  <g transform="translate(110 380)">
    <rect x="0" y="0" width="170" height="170" rx="26" fill="url(#blue)" stroke="#dbe7ff" stroke-opacity="0.5" stroke-width="2" />
    <text x="85" y="106" fill="#fff7ee" font-family="Georgia, serif" font-size="54" text-anchor="middle">Cmaj9</text>
  </g>

  <text x="720" y="236" fill="#d9b45a" font-family="Georgia, serif" font-size="30" letter-spacing="6">RNG CHORDS</text>
  <text x="720" y="326" fill="#f3efe2" font-family="Georgia, serif" font-size="68">Roll the dice,</text>
  <text x="720" y="406" fill="#f3efe2" font-family="Georgia, serif" font-size="68">get a chord</text>
  <text x="720" y="486" fill="#f3efe2" font-family="Georgia, serif" font-size="68">progression.</text>

  <defs>
    <radialGradient id="felt" cx="50%" cy="40%" r="75%">
      <stop stop-color="#1f5a3f" />
      <stop offset="1" stop-color="#0d2a1d" />
    </radialGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d4505d" />
      <stop offset="1" stop-color="#7a1f2b" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e3bd6e" />
      <stop offset="1" stop-color="#9a7230" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#4f78d6" />
      <stop offset="1" stop-color="#25408a" />
    </linearGradient>
  </defs>
</svg>
